namespace: DevichanE2E
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
params:
    - env
extensions:
    enabled:
        - Codeception\Extension\RunFailed
coverage:
    enabled: true
    remote: true
    c3_url: '%E2E_BASE_URL%'
    include:
        - ./*.php
        - auth/*.php
        - inc/*
    exclude:
        - inc/lib/*
        - inc/image/bmp.php
        - inc/secrets.php
        - templates/cache/*
        - vendor/*
        - tests/*
