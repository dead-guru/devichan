<!doctype html>
<html lang="{{ config.locale|default('en')|slice(0, 2) }}">
<head>
	<meta charset="utf-8">
	{% if config.url_favicon %}<link rel="shortcut icon" href="{{ config.url_favicon }}">{% endif %}
	<style type="text/css">
		body{margin:0}
		iframe{box-sizing:border-box;border:none;margin:0;padding:0;height:100%;position:absolute;top:0}
		iframe#sidebar{left:0;width:15%}
		iframe#main{border-left:1px solid black;left:15%;width:85%}
	</style>
	<title>{{ settings.title }}</title>
</head>
<body>
	<iframe src="{{ settings.file_sidebar }}" id="sidebar" name="sidebar"></iframe>
	<iframe src="{{ settings.file_news }}" id="main" name="main"></iframe>
</body>
</html>
