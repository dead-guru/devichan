<form class="mod-form" action="?/{{ board }}/move_reply/{{ post }}" method="post" onsubmit="btnSubmit.disabled = true; return true;">
	<input type="hidden" name="token" value="{{ token }}">
	<table>
		<tr>
			<th>{% trans 'Post ID' %}</th>
			<td>&gt;&gt;&gt;{{ config.board_abbreviation|sprintf(board) }}{{ post }}</td>
		</tr>
		<tr>
			<th>{% trans 'Target board' %}</th>
			<td>
				<ul class="mod-choices">
					{% for targetboard in boards %}
						<li><input type="radio" name="board" value="{{ targetboard.uri }}" id="move-board-{{ targetboard.uri }}"{% if boards|length == 2 %} checked{% endif %}> <label for="move-board-{{ targetboard.uri }}">{{ config.board_abbreviation|sprintf(targetboard.uri) }} - {{ targetboard.title|e }}</label></li>
					{% endfor %}
				</ul>
			</td>
		</tr>
		<tr>
			<th><label for="target_thread">{% trans 'Target thread' %}</label></th>
			<td>
				<input type="text" name="target_thread" id="target_thread" size="10">
				<div class="unimportant">{% trans 'Leave empty to make the reply a new thread.' %}</div>
			</td>
		</tr>
		<tr>
			<td></td>
			<td><input type="submit" name="btnSubmit" value="{% trans 'Move reply' %}"></td>
		</tr>
	</table>
</form>
