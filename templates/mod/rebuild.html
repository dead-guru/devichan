<form class="mod-form" action="?/rebuild" method="post">
	<input type="hidden" name="token" value="{{ token }}">
	<table>
		<tr>
			<th>{% trans 'Rebuild' %}</th>
			<td>
				<ul class="mod-choices" id="rebuild">
					<li><input type="checkbox" id="rebuild_all" data-toggle="rebuild"> <label for="rebuild_all"><em>{% trans 'Toggle all' %}</em></label></li>
					<li><input type="checkbox" name="rebuild_cache" id="rebuild_cache" checked> <label for="rebuild_cache">{% trans 'Flush cache' %}</label></li>
					<li><input type="checkbox" name="rebuild_javascript" id="rebuild_javascript" checked> <label for="rebuild_javascript">{% trans 'Rebuild Javascript' %}</label></li>
					<li><input type="checkbox" name="rebuild_index" id="rebuild_index" checked> <label for="rebuild_index">{% trans 'Rebuild index pages' %}</label></li>
					<li><input type="checkbox" name="rebuild_thread" id="rebuild_thread" checked> <label for="rebuild_thread">{% trans 'Rebuild thread pages' %}</label></li>
					<li><input type="checkbox" name="rebuild_themes" id="rebuild_themes" checked> <label for="rebuild_themes">{% trans 'Rebuild themes' %}</label></li>
					<li><input type="checkbox" name="rebuild_posts" id="rebuild_posts"> <label for="rebuild_posts">{% trans 'Rebuild replies' %}</label></li>
				</ul>
			</td>
		</tr>
		<tr>
			<th>{% trans 'Boards' %}</th>
			<td>
				<ul class="mod-choices" id="boards">
					<li><input type="checkbox" name="boards_all" id="boards_all" data-toggle="boards" checked> <label for="boards_all"><em>{% trans 'all boards' %}</em></label></li>
					{% for board in boards %}
						<li><input type="checkbox" name="board_{{ board.uri }}" id="board-{{ board.uri }}" checked> <label for="board-{{ board.uri }}">{{ config.board_abbreviation|sprintf(board.uri) }} - {{ board.title|e }}</label></li>
					{% endfor %}
				</ul>
			</td>
		</tr>
		<tr>
			<td></td>
			<td><input type="submit" value="{% trans 'Rebuild' %}" name="rebuild"></td>
		</tr>
	</table>
</form>
<script>
	document.querySelectorAll('[data-toggle]').forEach(function(toggle) {
		toggle.addEventListener('change', function() {
			document.querySelectorAll('#' + toggle.dataset.toggle + ' input[type="checkbox"]').forEach(function(box) {
				box.checked = toggle.checked;
			});
		});
	});
</script>
