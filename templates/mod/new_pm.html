<form class="mod-form" action="?/new_PM/{{ username|e }}" method="post">
	<input type="hidden" name="token" value="{{ token }}">
	<table>
		<tr>
			<th>{% trans 'To' %}</th>
			<td>{% if mod|hasPermission(config.mod.editusers) %}<a href="?/users/{{ id }}">{{ username|e }}</a>{% else %}{{ username|e }}{% endif %}</td>
		</tr>
		<tr>
			<th><label for="message">{% trans 'Message' %}</label></th>
			<td><textarea name="message" id="message" rows="10" cols="55">{{ message }}</textarea></td>
		</tr>
		<tr>
			<td></td>
			<td><input type="submit" value="{% trans 'Send message' %}"></td>
		</tr>
	</table>
</form>
