{% if config.url_banner %}<img class="board_image" src="{{ config.url_banner }}" {% if config.banner_width or config.banner_height %}style="{% if config.banner_width %}width:{{ config.banner_width }}px{% endif %};{% if config.banner_height %}height:{{ config.banner_height }}px{% endif %}" {% endif %}alt="" />{% endif %}
{% if error %}<p class="mod-summary"><strong>{{ error }}</strong></p>{% endif %}
<form class="mod-form" action="" method="post">
	<table>
		<tr>
			<th><label for="username">{% trans 'Username' %}</label></th>
			<td><input type="text" name="username" id="username" size="20" maxlength="30" value="{{ username|e }}" autocomplete="username" autofocus></td>
		</tr>
		<tr>
			<th><label for="password">{% trans 'Password' %}</label></th>
			<td><input type="password" name="password" id="password" size="20" maxlength="30" value="" autocomplete="current-password"></td>
		</tr>
		<tr>
			<td></td>
			<td><input type="submit" name="login" value="{% trans %}Continue{% endtrans %}"></td>
		</tr>
	</table>
</form>
