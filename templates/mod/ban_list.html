<script src='{{ config.root }}main.js'></script>
<script src='{{ config.root }}js/jquery.min.js'></script>
<script src='{{ config.root }}js/mobile-style.js'></script>
<script src='{{ config.root }}js/strftime.min.js'></script>
<script src='{{ config.root }}js/mod/ban-list.js'></script>
<link rel='stylesheet' href='{{ config.root }}stylesheets/mod/ban-list.css'>

<div class="banlist-opts mod-summary">
	<input type="search" id="search" placeholder="{% trans %}Search{% endtrans %}" title="{% trans %}Words to find. Prefix with mask:, reason:, board:, staff: or message: to search one column.{% endtrans %}">
	<label><input type="checkbox" id="only_not_expired"> {% trans %}Show only active bans{% endtrans %}</label>
	{% if mod and mod.boards[0] != '*' %}
		<label><input type="checkbox" id="only_mine"> {% trans %}Show only bans from boards I moderate{% endtrans %}</label>
	{% endif %}
	<span id="banlist-count" class="unimportant"></span>
</div>

<form action="?/bans" method="post" class="banform">
	{% if token %}
		<input type="hidden" name="token" value="{{ token }}">
	{% endif %}

	<table class="modlog" id="banlist" data-flag-uri="{{ config.uri_flags|e('html_attr') }}"></table>

	{% if mod %}
		<p><input type="submit" name="unban" id="unban" value="{% trans 'Unban selected' %}"></p>
	{% endif %}
</form>
{% if token_json %}
	<script>$(function(){ banlist_init("{{ token_json }}", {{ boards }}); });</script>
{% else %}
	<script>$(function(){ banlist_init("{{ uri_json }}", {{ boards }}, true); });</script>
{% endif %}
