<form class="mod-form" action="" method="post">
	<input type="hidden" name="token" value="{{ token }}">
	<table>
		{% if not config %}
			<tr>
				<td colspan="2" class="unimportant">({% trans 'No configuration required.' %})</td>
			</tr>
		{% else %}
			{% for conf in theme.config %}
				<tr>
					<th>{{ conf.title }}</th>
					<td>
						{% if conf.type == 'checkbox' %}
							<input type="checkbox" name="{{ conf.name }}"{% if settings[conf.name] or (not settings[conf.name] is defined and conf.default) %} checked{% endif %}>
						{% elseif conf.type == 'textarea' %}
							<textarea name="{{ conf.name }}" rows="25" cols="60">{% if settings[conf.name] %}{{ settings[conf.name] }}{% elseif conf.default %}{{ conf.default }}{% endif %}</textarea>
						{% else %}
							<input type="text" name="{{ conf.name }}"{% if settings[conf.name] %} value="{{ settings[conf.name] }}"{% elseif conf.default %} value="{{ conf.default }}"{% endif %}{% if conf.size %} size="{{ conf.size }}"{% endif %}>
						{% endif %}
						{% if conf.comment %}
							<div class="unimportant">{{ conf.comment }}</div>
						{% endif %}
					</td>
				</tr>
			{% endfor %}
		{% endif %}
		<tr>
			<td></td>
			<td><input name="install" type="submit" value="{% trans 'Install theme' %}"></td>
		</tr>
	</table>
</form>
