name: E2E

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeception:
    name: PHP 8.1 and Twig 2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the PHP image
        run: make e2e-build

      - name: Start the test services
        run: make e2e-up

      - name: Prepare the application fixture
        run: make e2e-prepare

      - name: Run the E2E tests
        run: make e2e-run

      - name: Show the service logs
        if: failure()
        run: docker compose -p devichan-e2e -f compose.test.yml logs --tail 200

      - name: Add the coverage summary
        if: always()
        run: |
          if test -f tests/_output/coverage.txt; then
            cat tests/_output/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeception-e2e-reports
          path: tests/_output/
          if-no-files-found: error
          retention-days: 14

      - name: Stop the test services
        if: always()
        run: make e2e-down
